version: 2.1

jobs:
  do-service:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare upstream B
          command: |
            mkdir -p /var/tmp/shard1
            set +o pipefail 2>/dev/null; seq 1 1255439 | gzip --rsyncable 2>/dev/null | base64 > /var/tmp/shard1/seed_417 || seq 1 1255439 | gzip -c | base64 > /var/tmp/shard1/seed_417; true
            echo "report | bytes=$(wc -c </var/tmp/shard1/seed_417) | lines=$(wc -l </var/tmp/shard1/seed_417) | words=$(wc -w </var/tmp/shard1/seed_417)"
      - persist_to_workspace:
          root: /var/tmp/shard1
          paths:
            - 'seed_417'
  spin-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/shard1
      - run:
          name: Fetch handoff signal
          command: |
            { tail -c 1 /var/tmp/shard1/seed_417 2>/dev/null; echo " <last byte>" ; } || true
      - run:
          name: Fetch project tree
          command: git clone --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar --extract --xz -f prod-blobs-stage.tar.xz
      - run:
          command: nice -n 0 ./launch-thread
  Lock2PCI:
    docker:
